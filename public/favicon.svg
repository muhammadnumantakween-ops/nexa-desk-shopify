<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="nexaGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="nexaCyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="nexaDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base for App Icon Compatibility -->
  <rect width="100" height="100" rx="22" fill="url(#nexaDarkBg)" stroke="rgba(212, 175, 55, 0.35)" stroke-width="2" />

  <!-- Geometric Nexa N + Hexagonal Desk Geometry -->
  <!-- Left Column: Precision Gold Pillar -->
  <path d="M26 74V26L40 26V74H26Z" fill="url(#nexaGoldGrad)" />

  <!-- Diagonal Power Link: Technical Bridge with Gold-to-Cyan accent -->
  <path d="M40 26L60 74H74L54 26H40Z" fill="url(#nexaGoldGrad)" filter="url(#glowGold)" />

  <!-- Right Pillar: Grounded Dark Gold to Cyan Power Conduit -->
  <path d="M60 26H74V74H60V26Z" fill="url(#nexaGoldGrad)" />

  <!-- Center Active Node: Desk Hub Glowing Dot -->
  <circle cx="50" cy="50" r="5.5" fill="#38BDF8" />
  <circle cx="50" cy="50" r="8" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
